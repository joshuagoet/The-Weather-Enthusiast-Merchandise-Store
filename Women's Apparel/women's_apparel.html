<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Weather Enthusiast Official Merch Store - Women's Apparel</title>
  
  <style>
    /* Native CSS Resets & Foundations */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. Announcement Bar Styles */
    .announcement-bar {
      background-color: #00D8FF;
      color: #000000;
      text-align: center;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hidden {
      display: none !important;
    } 

    /* 2. Header Layout Styles */
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
    }

    .navbar-container {
      max-width: 100%;
      height: 96px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      gap: 0;
    }

    /* Stacked Logo */
    .logo {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 30px;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      line-height: 1.0;
      text-decoration: none;
      color: #000000;
      display: inline-block;
      text-align: left;
      flex-shrink: 0;
      margin-left: auto;
      margin-right: auto;
    }

    .logo span {
      display: block;
    }

    /* Mobile Hamburger Icon */
    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      padding: 0;
    }

    .mobile-menu-toggle span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: #000000;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Desktop Navigation Links */
    .nav-links {
      display: flex;
      gap: 22px;
      white-space: nowrap;
      flex-wrap: nowrap;
      align-items: center;
      margin-left: 0;
      margin-right: auto;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .nav-links a:hover {
      color: #000000;
    }

    /* Right Utilities */
    .nav-utilities {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      font-weight: 400;
      flex-shrink: 0;
    }

    .currency-selector {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .currency-selector svg {
      width: 12px;
      height: 12px;
      margin-left: 4px;
      margin-top: 1px;
    }

    .cart-icon {
      color: #000000;
      display: flex;
      align-items: center;
      transition: opacity 0.15s ease;
    }

    .cart-icon:hover {
      opacity: 0.7;
    }

    /* 3. Catalog Container & Desktop Grid Layout */
    .catalog-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .catalog-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
      color: #000000;
    }

    .products-grid,
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px 24px;
    }

    /* Product Cards */
    .product-card {
      text-decoration: none;
      color: #000000;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
    }

    .card-image-box,
    .product-card-image {
      background-color: #EBEBEB;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin-bottom: 12px;
      width: 100%;
    }

    .card-image-box img,
    .product-card-image img {
      max-height: 85%;
      max-width: 85%;
      object-fit: contain;
    }

    .card-name,
    .product-card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #000000;
    }

    .card-price,
    .product-card-price {
      font-size: 14px;
      color: #6b7280;
      font-weight: 400;
    }

    /* 4. Complete Mobile Viewport Rules (max-width: 768px) */
    @media (max-width: 768px) {
      /* Mobile Navbar Layout */
      .navbar-container {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        height: 70px;
        padding: 0 16px;
        gap: 12px;
      }

      .mobile-menu-toggle {
        display: flex;
        grid-column: 1;
      }

      .logo {
        grid-column: 2;
        text-align: center;
        font-size: 28px;
        margin-left: 0;
        margin-right: 0;
      }

      .nav-utilities {
        grid-column: 3;
        gap: 12px;
      }

      /* Mobile Navigation Drawer */
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        border-bottom: 2px solid #f3f4f6;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
        margin: 0;
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        display: block;
        padding: 15px 20px;
        width: 100%;
        border-top: 1px solid #f3f4f6;
        font-size: 14px;
      }

      /* Hamburger Morph Animation */
      .mobile-menu-toggle.active span:nth-child(1) {
        transform: translateY(8.5px) rotate(45deg);
      }

      .mobile-menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }

      .mobile-menu-toggle.active span:nth-child(3) {
        transform: translateY(-8.5px) rotate(-45deg);
      }

      /* Page Padding & Spacing */
      .catalog-container,
      .catalog-layout,
      .main-layout {
        padding: 20px 14px;
      }

      .catalog-title,
      .page-title {
        font-size: 28px;
        margin-bottom: 20px;
      }

      .category-heading {
        font-size: 26px;
        margin-bottom: 16px;
      }

      .subcategory-heading {
        font-size: 18px;
        margin: 24px 0 12px 0;
      }

      /* 2-Column Mobile Product Grid Method */
      .products-grid,
      .product-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 20px 12px !important;
      }

      .card-image-box,
      .product-card-image {
        padding: 12px !important;
        margin-bottom: 8px !important;
      }

      .card-name,
      .product-card-title {
        font-size: 14px;
      }

      .card-price,
      .product-card-price {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Announcement Bar -->
  <div id="top-announcement" class="announcement-bar"></div>

  <!-- Main Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <a href="../index.html" class="logo">
        THE WEATHER
        <span>ENTHUSIAST</span>
      </a>

      <div class="nav-links" id="navLinks">
        <a href="../index.html" class="data-nav-link">Home</a>
        <a href="../All%20Products/all_products.html" class="data-nav-link">All Products</a>
        <a href="../Men%27s%20Apparel/men's_apparel.html" class="data-nav-link">Men's Apparel</a>
        <a href="women's_apparel.html" class="data-nav-link">Women's Apparel</a>
        <a href="../Kids%20Apparel/kids_apparel.html" class="data-nav-link">Kids Apparel</a>
        <a href="../Bottoms%2C%20Drinkware%2C%20Gear%2C%20%26%20Accessories/drinkware_gear_and_accessories.html" class="data-nav-link">Drinkware, Gear, & Accessories</a>
        <a href="../Promotional%20%26%20Milestone%20Items/promotional_and_milestone_items.html" class="data-nav-link">Promotional & Milestone Items</a>
      </div>

      <div class="nav-utilities">
        <div class="currency-selector">
          <span>USD</span>
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <a href="../index.html" class="cart-icon" aria-label="View Cart">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </a>
      </div>

    </div>
  </nav>

  <!-- Product Catalog Grid -->
  <main class="catalog-container">
    <h1 class="catalog-title">WOMEN'S APPAREL</h1>
    <div id="womens-products-grid" class="products-grid"></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. Announcement Bar Check
      const bar = document.getElementById("top-announcement");
      if (bar && (!bar.textContent || bar.textContent.trim() === "")) {
        bar.classList.add("hidden");
      }

      // 2. Navigation Active State Guard
      const currentPath = decodeURIComponent(window.location.pathname.split("/").pop()) || "women's_apparel.html";
      const navLinks = document.querySelectorAll(".data-nav-link");

      navLinks.forEach(link => {
        const targetFile = decodeURIComponent(link.getAttribute("href").split("/").pop());
        if (currentPath === targetFile) {
          link.style.color = "#000000"; 
          link.style.fontWeight = "400"; 
          link.style.cursor = "default";
          link.addEventListener("click", function(event) { event.preventDefault(); });
        }
      });

      // 3. Mobile Hamburger Menu Toggle
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const navMenuContainer = document.getElementById('navLinks');

      if (mobileMenuToggle && navMenuContainer) {
        mobileMenuToggle.addEventListener('click', function() {
          mobileMenuToggle.classList.toggle('active');
          navMenuContainer.classList.toggle('active');
        });
      }

      // 4. Generate 9 Distinct Women's Apparel Items
      const womensItems = [
        { id: 1, name: "Women's Hailinator Fitted Tee #1", price: "$29.95", img: "", link: "../Home/product_detail.html?item=11" },
        { id: 2, name: "Women's Supercell Cropped Hoodie #2", price: "$46.95", img: "", link: "../Home/product_detail.html?item=12" },
        { id: 3, name: "Women's Radar V-Neck Shirt #3", price: "$28.95", img: "", link: "../Home/product_detail.html?item=13" },
        { id: 4, name: "Women's Velocity Tank Top #4", price: "$24.95", img: "", link: "../Home/product_detail.html?item=14" },
        { id: 5, name: "Women's Storm Front Pullover #5", price: "$49.95", img: "", link: "../Home/product_detail.html?item=15" },
        { id: 6, name: "Women's Microburst Performance Tee #6", price: "$32.95", img: "", link: "../Home/product_detail.html?item=16" },
        { id: 7, name: "Women's Tornado Alley Sweatshirt #7", price: "$44.95", img: "", link: "../Home/product_detail.html?item=17" },
        { id: 8, name: "Women's Lightning Long Sleeve #8", price: "$36.95", img: "", link: "../Home/product_detail.html?item=18" },
        { id: 9, name: "Women's Isobar Fleece Jacket #9", price: "$58.95", img: "", link: "../Home/product_detail.html?item=19" }
      ];

      const gridContainer = document.getElementById("womens-products-grid");
      if (gridContainer) {
        gridContainer.innerHTML = womensItems.map(item => `
          <a href="${item.link}" class="product-card">
            <div class="card-image-box"><img src="${item.img}" alt="${item.name}" /></div>
            <div class="card-name">${item.name}</div>
            <div class="card-price">${item.price}</div>
          </a>
        `).join('');
      }
    });
  </script>
</body>
</html>
