<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products - The Weather Enthusiast Official Merch Store</title>
  
  <style>
    /* Native CSS Resets & Foundations */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. Announcement Bar Styles */
    .announcement-bar {
      background-color: #00D8FF;
      color: #000000;
      text-align: center;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hidden {
      display: none !important;
    } 

    /* 2. Header Layout Styles */
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
    }

    .navbar-container {
      max-width: 100%;
      height: 96px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      gap: 0;
    }

    /* Stacked Logo */
    .logo {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 30px;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      line-height: 1.0;
      text-decoration: none;
      color: #000000;
      display: inline-block;
      text-align: left;
      flex-shrink: 0;
      margin-left: auto;
      margin-right: auto;
    }

    .logo span {
      display: block;
    }

    /* Mobile Hamburger Icon (Hidden on Desktop) */
    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      padding: 0;
    }

    .mobile-menu-toggle span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: #000000;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Desktop Navigation Links */
    .nav-links {
      display: flex;
      gap: 22px;
      white-space: nowrap;
      flex-wrap: nowrap;
      align-items: center;
      margin-left: 0;
      margin-right: auto;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .nav-links a:hover {
      color: #000000;
    }

    /* Right Utilities (Currency & Cart) */
    .nav-utilities {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      font-weight: 400;
      flex-shrink: 0;
    }

    .currency-selector {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .currency-selector svg {
      width: 12px;
      height: 12px;
      margin-left: 4px;
      margin-top: 1px;
    }

    .cart-icon {
      color: #000000;
      display: flex;
      align-items: center;
      transition: opacity 0.15s ease;
    }

    .cart-icon:hover {
      opacity: 0.7;
    }

    /* Mobile Viewport Header Rules (<= 768px) */
    @media (max-width: 768px) {
      .navbar-container {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        height: 70px;
        padding: 0 16px;
        gap: 12px;
      }

      .mobile-menu-toggle {
        display: flex;
        grid-column: 1;
      }

      .logo {
        grid-column: 2;
        text-align: center;
        font-size: 28px;
        margin-left: 0;
        margin-right: 0;
      }

      .nav-utilities {
        grid-column: 3;
        gap: 12px;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        border-bottom: 2px solid #f3f4f6;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
        margin: 0;
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        display: block;
        padding: 15px 20px;
        width: 100%;
        border-top: 1px solid #f3f4f6;
        font-size: 14px;
      }

      .mobile-menu-toggle.active span:nth-child(1) {
        transform: translateY(8.5px) rotate(45deg);
      }

      .mobile-menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }

      .mobile-menu-toggle.active span:nth-child(3) {
        transform: translateY(-8.5px) rotate(-45deg);
      }
    }

    /* 3. Catalog Page Layout & Responsive Grid */
    .main-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 32px;
    }

    .category-section {
      margin-bottom: 48px;
    }

    .category-heading {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 28px;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 24px;
    }

    /* 3-Column Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Product Card Component */
    .product-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: #000000;
    }

    .product-card-image {
      background-color: #EBEBEB;
      aspect-ratio: 1 / 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      padding: 24px;
    }

    .product-card-image img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }

    .product-card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .product-card-price {
      font-size: 14px;
      color: #6b7280;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <!-- 1. Top Announcement Bar (Auto-hides if empty) -->
  <div id="top-announcement" class="announcement-bar"></div>

  <!-- 2. Precise Structural Header Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      
      <!-- Mobile Hamburger Button -->
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Stacked Logo (Navigates backward to Root index.html) -->
      <a href="../index.html" class="logo">
        THE WEATHER
        <span>ENTHUSIAST</span>
      </a>

      <!-- Navigation Links Container (Using Relative Level 1 Paths) -->
      <div class="nav-links" id="navLinks">
        <a href="../index.html" class="data-nav-link">Home</a>
        <a href="all_products.html" class="data-nav-link">All Products</a>
        <a href="../Men%27s%20Apparel/mens_apparel.html" class="data-nav-link">Men's Apparel</a>
        <a href="../Women%27s%20Apparel/womens_apparel.html" class="data-nav-link">Women's Apparel</a>
        <a href="../Kids%20Apparel/kids_apparel.html" class="data-nav-link">Kids Apparel</a>
        <a href="../Bottoms%2C%20Drinkware%2C%20Gear%2C%20%26%20Accessories/bottoms_drinkware.html" class="data-nav-link">Drinkware, Gear, & Accessories</a>
        <a href="../Promotional%20%26%20Milestone%20Items/promotional_milestone.html" class="data-nav-link">Promotional & Milestone Items</a>
      </div>

      <!-- Right Utility Actions -->
      <div class="nav-utilities">
        <div class="currency-selector">
          <span>USD</span>
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <a href="../index.html" class="cart-icon" aria-label="View Cart">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </a>
      </div>

    </div>
  </nav>

  <!-- 3. Master Catalog Directory Layout -->
  <main class="main-layout">
    <h1 class="page-title">All Products</h1>

    <!-- Men's Apparel Section preview -->
    <section class="category-section">
      <h2 class="category-heading">MEN'S APPAREL</h2>
      <div class="product-grid">
        <a href="../Men%27s%20Apparel/Standard%20T-Shirts/standard_t_shirt.html" class="product-card">
          <div class="product-card-image">
            <img src="" alt="Men's Standard T-Shirts" />
          </div>
          <div class="product-card-title">Men's Standard T-Shirts</div>
          <div class="product-card-price">$29.95</div>
        </a>

        <a href="../Home/product_detail.html?item=2" class="product-card">
          <div class="product-card-image">
            <img src="" alt="Men's Hailinator Premium Tee #2" />
          </div>
          <div class="product-card-title">Men's Hailinator Premium Tee #2</div>
          <div class="product-card-price">$29.95</div>
        </a>

        <a href="../Home/product_detail.html?item=3" class="product-card">
          <div class="product-card-image">
            <img src="" alt="Men's Velocity Pullover Hoodie #3" />
          </div>
          <div class="product-card-title">Men's Velocity Pullover Hoodie #3</div>
          <div class="product-card-price">$49.95</div>
        </a>
      </div>
    </section>
  </main>

  <!-- JavaScript Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. Automatically hide top announcement bar if empty
      const bar = document.getElementById("top-announcement");
      if (bar && (!bar.textContent || bar.textContent.trim() === "")) {
        bar.classList.add("hidden");
      }

      // 2. Highlight current page link cleanly without forced bold weight
      const currentFilename = decodeURIComponent(window.location.pathname.split("/").pop()) || "all_products.html";
      const navLinks = document.querySelectorAll(".data-nav-link");

      navLinks.forEach(link => {
        const targetAttr = link.getAttribute("href");
        const targetFilename = decodeURIComponent(targetAttr.split("/").pop());

        if (currentFilename === targetFilename) {
          link.style.color = "#000000";
          link.style.fontWeight = "400";
          link.style.cursor = "default";
          
          link.addEventListener("click", function(event) {
            event.preventDefault();
          });
        }
      });

      // 3. Mobile Hamburger Menu Toggle
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const navMenuContainer = document.getElementById('navLinks');

      if (mobileMenuToggle && navMenuContainer) {
        mobileMenuToggle.addEventListener('click', function() {
          mobileMenuToggle.classList.toggle('active');
          navMenuContainer.classList.toggle('active');
        });
      }
    });
  </script>
</body>
</html>
