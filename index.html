<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Weather Enthusiast Official Merch Store</title>
  
  <style>
    /* Native CSS Resets & Foundations */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. Announcement Bar Styles (Cyan Accent matching reference screenshot) */
    .announcement-bar {
      background-color: #00D8FF;
      color: #000000;
      text-align: center;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hidden {
      display: none !important;
    } 

    /* 2. Header Layout & Responsive Mobile Navigation */
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #f3f4f6;
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
    }

    .navbar-container {
      max-width: 100%;
      height: 96px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      gap: 24px;
    }

    /* Two-Line Stacked Logo Typography */
    .logo {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 20px;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.88; /* Tight line height matching reference image */
      text-decoration: none;
      color: #000000;
      display: inline-block;
      text-align: left;
    }

    .logo span {
      display: block; /* Forces ENTHUSIAST to break onto line 2 */
    }

    /* Mobile Hamburger Icon (Hidden on Desktop) */
    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      padding: 0;
    }

    .mobile-menu-toggle span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: #000000;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Navigation Links Container */
    .nav-links {
      display: flex;
      gap: 30px;
      white-space: nowrap;
      flex-wrap: nowrap;
      margin-right: auto;
      margin-left: auto;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 500;
      color: #1f2937;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .nav-links a:hover {
      color: #000000;
    }

    .nav-utilities {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .currency-selector {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .currency-selector svg {
      width: 14px;
      height: 14px;
      margin-left: 4px;
      margin-top: 2px;
    }

    .cart-icon {
      color: #000000;
      display: flex;
      align-items: center;
      transition: opacity 0.15s ease;
    }

    .cart-icon:hover {
      opacity: 0.7;
    }

    /* Mobile Viewport Header Rules (<= 768px) */
    @media (max-width: 768px) {
      .navbar-container {
        display: grid;
        grid-template-columns: 28px 1fr auto; /* Left hamburger, Center Logo, Right utilities */
        height: 70px;
        padding: 0 16px;
        gap: 12px;
      }

      .mobile-menu-toggle {
        display: flex;
        grid-column: 1;
      }

      .logo {
        grid-column: 2;
        text-align: center;
        font-size: 16px; /* Scaled cleanly for mobile displays */
      }

      .nav-utilities {
        grid-column: 3;
        gap: 12px;
      }

      /* Slide-down mobile dropdown container */
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        border-bottom: 2px solid #f3f4f6;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
        margin: 0;
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        display: block;
        padding: 15px 20px;
        width: 100%;
        border-top: 1px solid #f3f4f6;
        font-size: 14px;
      }

      /* Hamburger Transformation to 'X' */
      .mobile-menu-toggle.active span:nth-child(1) {
        transform: translateY(8.5px) rotate(45deg);
      }

      .mobile-menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }

      .mobile-menu-toggle.active span:nth-child(3) {
        transform: translateY(-8.5px) rotate(-45deg);
      }
    }

    /* 3. Main Product Page Panel Split & Mobile Scaling */
    .main-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px; /* Tight edge padding for mobile screens */
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 1024px) {
      .main-layout {
        grid-template-columns: repeat(12, minmax(0, 1fr));
        padding: 56px 48px;
        gap: 64px;
      }
    }

    /* Left Side Presenter Box */
    .image-column {
      grid-column: span 12;
      background-color: #EBEBEB;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 2px;
    }

    @media (min-width: 1024px) {
      .image-column {
        grid-column: span 6;
        padding: 32px;
      }
    }

    .image-column img {
      max-height: 90%;
      max-width: 90%;
      object-fit: contain;
    }

    /* Right Side Details Column */
    .details-column {
      grid-column: span 12;
      display: flex;
      flex-direction: column;
      padding-top: 4px;
    }

    @media (min-width: 1024px) {
      .details-column {
        grid-column: span 6;
      }
    }

    /* Heavy Headline Typography */
    .product-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.01em;
      line-height: 1.2;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    @media (min-width: 1024px) {
      .product-title {
        font-size: 38px;
      }
    }

    .product-price {
      font-size: 18px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 24px;
    }

    /* Color Selection Elements */
    .section-label {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #6b7280;
      display: block;
      margin-bottom: 12px;
    }

    .color-container {
      margin-bottom: 28px;
    }

    .color-dots-row {
      display: flex;
      gap: 14px;
    }

    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid transparent;
      cursor: pointer;
      outline: none;
    }

    .color-dot.active {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    /* Size Selector Matrix Elements */
    .size-container {
      margin-bottom: 40px;
    }

    .size-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .size-guide-link {
      font-size: 12px;
      color: #6b7280;
      text-decoration: underline;
    }

    .size-guide-link:hover {
      color: #000000;
    }

    .sizes-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    @media (min-width: 640px) {
      .sizes-grid {
        grid-template-columns: repeat(9, minmax(0, 1fr));
      }
    }

    .size-box {
      border: 1px solid #e5e7eb;
      background: #ffffff;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .size-box:hover {
      border-color: #000000;
    }

    .size-box.active {
      border-color: #000000;
      background-color: #ffffff;
      font-weight: 700;
    }

    /* Add To Cart Button Form Action */
    .add-to-cart-btn {
      width: 100%;
      background-color: #2f00ff;
      color: #FFFFFF;
      border: none;
      height: 54px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .add-to-cart-btn:hover {
      background-color: #1f029e;
    }

    .add-to-cart-btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <!-- 1. Top Announcement Bar -->
  <div id="top-announcement" class="announcement-bar">NEW! Quotes Collection is out NOW!</div>

  <!-- 2. Precise Structural Header Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      
      <!-- Mobile Hamburger Button -->
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Centered Stacked Store Logo -->
      <a href="index.html" class="logo">
        THE WEATHER
        <span>ENTHUSIAST</span>
      </a>

      <!-- Navigation Links Container -->
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="data-nav-link">Home</a>
        <a href="./All%20Products/all_products.html" class="data-nav-link">All Products</a>
        <a href="./Men%27s%20Apparel/mens_apparel.html" class="data-nav-link">Men's Apparel</a>
        <a href="./Women%27s%20Apparel/womens_apparel.html" class="data-nav-link">Women's Apparel</a>
        <a href="./Kids%20Apparel/kids_apparel.html" class="data-nav-link">Kids Apparel</a>
        <a href="./Bottoms%2C%20Drinkware%2C%20Gear%2C%20%26%20Accessories/bottoms_drinkware.html" class="data-nav-link">Drinkware, Gear, & Accessories</a>
        <a href="./Promotional%20%26%20Milestone%20Items/promotional_milestone.html" class="data-nav-link">Promotional & Milestone Items</a>
      </div>

      <!-- Right Utility Actions -->
      <div class="nav-utilities">
        <div class="currency-selector">
          <span>USD</span>
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <a href="index.html" class="cart-icon" aria-label="View Cart">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </a>
      </div>

    </div>
  </nav>

  <!-- 3. Two-Column Split Layout Panel -->
  <main class="main-layout">
    <div class="image-column">
      <img src="" alt="Hailinator Premium T-Shirt" />
    </div>

    <div class="details-column">
      <h1 class="product-title">Hailinator Premium T-Shirt</h1>
      <div class="product-price">$29.95</div>

      <div class="color-container">
        <span class="section-label">Select color: <strong id="selected-color-label">Black</strong></span>
        <div class="color-dots-row">
          <button class="color-dot active" style="background-color: #000000;"></button>
          <button class="color-dot" style="background-color: #1C1D21;"></button>
          <button class="color-dot" style="background-color: #1D4A7D;"></button>
          <button class="color-dot" style="background-color: #3B9EB9;"></button>
          <button class="color-dot" style="background-color: #466974;"></button>
          <button class="color-dot" style="background-color: #0C5843;"></button>
        </div>
      </div>

      <div class="size-container">
        <div class="size-header-row">
          <span class="section-label">Select size</span>
          <a href="#" class="size-guide-link">Size guide</a>
        </div>
        <div class="sizes-grid">
          <button class="size-box">XS</button>
          <button class="size-box">S</button>
          <button class="size-box active">M</button>
          <button class="size-box">L</button>
          <button class="size-box">XL</button>
          <button class="size-box">2XL</button>
          <button class="size-box">3XL</button>
          <button class="size-box">4XL</button>
          <button class="size-box">5XL</button>
        </div>
      </div>

      <button class="add-to-cart-btn">Add to Cart</button>
    </div>
  </main>

  <!-- JavaScript Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. Automatically hide top announcement bar if empty
      const bar = document.getElementById("top-announcement");
      if (bar && (!bar.textContent || bar.textContent.trim() === "")) {
        bar.classList.add("hidden");
      }

      // 2. Disable clicks and reloads if customer is already on current page
      const currentFilename = decodeURIComponent(window.location.pathname.split("/").pop()) || "index.html";
      const navLinks = document.querySelectorAll(".data-nav-link");

      navLinks.forEach(link => {
        const targetAttr = link.getAttribute("href");
        const targetFilename = decodeURIComponent(targetAttr.split("/").pop());

        if (currentFilename === targetFilename) {
          link.style.color = "#000000";
          link.style.fontWeight = "700";
          link.style.cursor = "default";
          
          link.addEventListener("click", function(event) {
            event.preventDefault();
          });
        }
      });

      // 3. Mobile Hamburger Menu Toggle
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const navMenuContainer = document.getElementById('navLinks');

      if (mobileMenuToggle && navMenuContainer) {
        mobileMenuToggle.addEventListener('click', function() {
          mobileMenuToggle.classList.toggle('active');
          navMenuContainer.classList.toggle('active');
        });
      }
    });
  </script>
</body>
</html>
