<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Shopping Cart - The Weather Enthusiast</title>
  
  <style>
    /* Native CSS Resets & Foundations */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. Announcement Bar Styles */
    .announcement-bar {
      background-color: #00D8FF;
      color: #000000;
      text-align: center;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hidden {
      display: none !important;
    } 

    /* 2. Header Layout Styles */
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
    }

    .navbar-container {
      max-width: 100%;
      height: 96px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      gap: 0;
    }

    /* Stacked Logo */
    .logo {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 30px;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      line-height: 1.0;
      text-decoration: none;
      color: #000000;
      display: inline-block;
      text-align: left;
      flex-shrink: 0;
      margin-left: auto;
      margin-right: auto;
    }

    .logo span {
      display: block;
    }

    /* Mobile Hamburger Icon */
    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      padding: 0;
    }

    .mobile-menu-toggle span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: #000000;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Desktop Navigation Links */
    .nav-links {
      display: flex;
      gap: 22px;
      white-space: nowrap;
      flex-wrap: nowrap;
      align-items: center;
      margin-left: 0;
      margin-right: auto;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .nav-links a:hover {
      color: #000000;
    }

    /* Right Utilities */
    .nav-utilities {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      font-weight: 400;
      flex-shrink: 0;
    }

    .currency-selector {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .currency-selector svg {
      width: 12px;
      height: 12px;
      margin-left: 4px;
      margin-top: 1px;
    }

    .cart-icon {
      color: #000000;
      display: flex;
      align-items: center;
      transition: opacity 0.15s ease;
    }

    .cart-icon:hover {
      opacity: 0.7;
    }

    /* 3. Empty Cart Main Content Area */
    .cart-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 120px 24px 140px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .empty-cart-title {
      font-family: sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.01em;
      margin-bottom: 32px;
      color: #000000;
      text-transform: none;
    }

    .start-shopping-btn {
      display: inline-block;
      background-color: #00D8FF;
      color: #000000;
      text-decoration: none;
      padding: 16px 48px;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.02em;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .start-shopping-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .start-shopping-btn:active {
      transform: scale(0.98);
    }

    /* 4. "You may also like" Section Footer */
    .recommendations-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 60px 24px;
    }

    .recommendations-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
      color: #000000;
    }

    /* 5. Complete Mobile Viewport Rules (max-width: 768px) */
    @media (max-width: 768px) {
      .navbar-container {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        height: 70px;
        padding: 0 16px;
        gap: 12px;
      }

      .mobile-menu-toggle {
        display: flex;
        grid-column: 1;
      }

      .logo {
        grid-column: 2;
        text-align: center;
        font-size: 28px;
        margin-left: 0;
        margin-right: 0;
      }

      .nav-utilities {
        grid-column: 3;
        gap: 12px;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #ffffff;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        border-bottom: 2px solid #f3f4f6;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
        margin: 0;
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        display: block;
        padding: 15px 20px;
        width: 100%;
        border-top: 1px solid #f3f4f6;
        font-size: 14px;
      }

      .mobile-menu-toggle.active span:nth-child(1) {
        transform: translateY(8.5px) rotate(45deg);
      }

      .mobile-menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }

      .mobile-menu-toggle.active span:nth-child(3) {
        transform: translateY(-8.5px) rotate(-45deg);
      }

      .cart-container {
        padding: 80px 16px 100px 16px;
      }

      .empty-cart-title {
        font-size: 32px;
        margin-bottom: 24px;
      }

      .start-shopping-btn {
        padding: 14px 40px;
        font-size: 16px;
      }

      .recommendations-container {
        padding: 0 16px 40px 16px;
      }

      .recommendations-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Announcement Bar -->
  <div id="top-announcement" class="announcement-bar"></div>

  <!-- Navigation Header Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <a href="index.html" class="logo">
        THE WEATHER
        <span>ENTHUSIAST</span>
      </a>

      <div class="nav-links" id="navLinks">
        <a href="index.html" class="data-nav-link">Home</a>
        <a href="All%20Products/all_products.html" class="data-nav-link">All Products</a>
        <a href="Men%27s%20Apparel/men's_apparel.html" class="data-nav-link">Men's Apparel</a>
        <a href="Women%27s%20Apparel/women's_apparel.html" class="data-nav-link">Women's Apparel</a>
        <a href="Kids%20Apparel/kids_apparel.html" class="data-nav-link">Kids Apparel</a>
        <a href="Drinkware,%20Gear,%20%26%20Accessories/drinkware_gear_and_accessories.html" class="data-nav-link">Drinkware, Gear, & Accessories</a>
        <a href="Promotional%20%26%20Milestone%20Items/promotional_and_milestone_items.html" class="data-nav-link">Promotional & Milestone Items</a>
      </div>

      <div class="nav-utilities">
        <div class="currency-selector">
          <span>USD</span>
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <a href="cart.html" class="cart-icon" aria-label="View Cart">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </a>
      </div>

    </div>
  </nav>

  <!-- Empty Cart Main Content -->
  <main class="cart-container">
    <h1 class="empty-cart-title">Your Shopping Cart is Empty</h1>
    <a href="All%20Products/all_products.html" class="start-shopping-btn">Start Shopping</a>
  </main>
  
  <!-- JavaScript Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. Automatically hide top announcement bar if empty
      const bar = document.getElementById("top-announcement");
      if (bar && (!bar.textContent || bar.textContent.trim() === "")) {
        bar.classList.add("hidden");
      }

      // 2. Folder-Safe Navigation Guard Logic
      const currentPath = decodeURIComponent(window.location.pathname.split("/").pop()) || "cart.html";
      const navLinks = document.querySelectorAll(".data-nav-link");

      navLinks.forEach(link => {
        const targetFile = decodeURIComponent(link.getAttribute("href").split("/").pop());
        if (currentPath === targetFile) {
          link.style.color = "#000000";
          link.style.fontWeight = "600";
          link.style.cursor = "default";
          link.addEventListener("click", function(event) {
            event.preventDefault();
          });
        }
      });

      // 3. Mobile Hamburger Menu Toggle
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const navMenuContainer = document.getElementById('navLinks');

      if (mobileMenuToggle && navMenuContainer) {
        mobileMenuToggle.addEventListener('click', function() {
          mobileMenuToggle.classList.toggle('active');
          navMenuContainer.classList.toggle('active');
        });
      }
    });
  </script>
</body>
</html>
